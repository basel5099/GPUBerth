name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r broker/requirements.txt
      - run: python tests/test_scheduler.py
      - run: bash -n host/gpuberth-ctl && bash -n storage/gpuberth-share && bash -n guest/gpuberth-cdi
